AWSTemplateFormatVersion: "2010-09-09"
Description: "YAM Funds Backend AWS-native infrastructure: DynamoDB, ECS Fargate, IAM, networking and useful outputs."

Parameters:
  ProjectName:
    Type: String
    Default: yam-funds
    Description: Prefix used to name AWS resources.
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    Description: Environment name used in resource names and tags.
  ContainerImage:
    Type: String
    Description: Full container image URI to deploy, for example account.dkr.ecr.region.amazonaws.com/yam-funds-backend:latest.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the ECS service will run.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet ids for the Fargate service. Use at least two subnets for higher availability.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to reach the application on port 8080.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Number of ECS tasks to run.
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: Fargate task CPU units.
  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192"]
    Description: Fargate task memory in MiB.
  CorsAllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated allowed CORS origins for the API.
  CreateEcrRepository:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Whether to create an ECR repository for the application image.
  EcrRepositoryName:
    Type: String
    Default: yam-funds-backend
    Description: ECR repository name created when CreateEcrRepository is true.
  DynamoDBBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: DynamoDB billing mode. PAY_PER_REQUEST satisfies the PT requirement; PROVISIONED can be used for stricter cost control.
  DynamoDBReadCapacityUnits:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Read capacity units used when DynamoDBBillingMode is PROVISIONED.
  DynamoDBWriteCapacityUnits:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Write capacity units used when DynamoDBBillingMode is PROVISIONED.

Conditions:
  ShouldCreateEcrRepository: !Equals [!Ref CreateEcrRepository, "true"]
  UseProvisionedDynamoDB: !Equals [!Ref DynamoDBBillingMode, PROVISIONED]

Resources:
  ClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-clients"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FundsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-funds"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-subscriptions"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: clientId
          AttributeType: S
        - AttributeName: fundId
          AttributeType: S
      KeySchema:
        - AttributeName: clientId
          KeyType: HASH
        - AttributeName: fundId
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-transactions"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: clientId
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: clientId
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  EcrRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateEcrRepository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}-backend"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Allows HTTP traffic to ${ProjectName} ${EnvironmentName} backend"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-backend-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-app-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBApplicationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ClientsTable.Arn
                  - !GetAtt FundsTable.Arn
                  - !GetAtt SubscriptionsTable.Arn
                  - !GetAtt TransactionsTable.Arn
        - PolicyName: NotificationsReservedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReservedForFutureSnsSmsAdapter
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
              - Sid: ReservedForFutureSesEmailAdapter
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}-backend"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DYNAMODB_SEED_ENABLED
              Value: "false"
            - Name: DYNAMODB_CLIENTS_TABLE
              Value: !Ref ClientsTable
            - Name: DYNAMODB_FUNDS_TABLE
              Value: !Ref FundsTable
            - Name: DYNAMODB_SUBSCRIPTIONS_TABLE
              Value: !Ref SubscriptionsTable
            - Name: DYNAMODB_TRANSACTIONS_TABLE
              Value: !Ref TransactionsTable
            - Name: CORS_ALLOWED_ORIGINS
              Value: !Ref CorsAllowedOrigins
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - "wget -q -O - http://localhost:8080/api/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FargateService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-backend"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ApplicationSecurityGroup
          Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ClientsTableName:
    Description: DynamoDB clients table name.
    Value: !Ref ClientsTable
  FundsTableName:
    Description: DynamoDB funds table name.
    Value: !Ref FundsTable
  SubscriptionsTableName:
    Description: DynamoDB subscriptions table name.
    Value: !Ref SubscriptionsTable
  TransactionsTableName:
    Description: DynamoDB transactions table name.
    Value: !Ref TransactionsTable
  DynamoDBBillingMode:
    Description: DynamoDB billing mode used by all application tables.
    Value: !Ref DynamoDBBillingMode
  EcsClusterName:
    Description: ECS cluster name.
    Value: !Ref EcsCluster
  EcsServiceName:
    Description: ECS service name.
    Value: !GetAtt FargateService.Name
  TaskDefinitionArn:
    Description: ECS task definition ARN.
    Value: !Ref TaskDefinition
  TaskRoleArn:
    Description: IAM role used by the application container.
    Value: !GetAtt ApplicationTaskRole.Arn
  SecurityGroupId:
    Description: Security group attached to the Fargate service.
    Value: !Ref ApplicationSecurityGroup
  LogGroupName:
    Description: CloudWatch log group for application logs.
    Value: !Ref ApplicationLogGroup
  EcrRepositoryUri:
    Condition: ShouldCreateEcrRepository
    Description: ECR repository URI for the application image.
    Value: !GetAtt EcrRepository.RepositoryUri
