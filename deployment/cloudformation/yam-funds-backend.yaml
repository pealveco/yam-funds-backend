AWSTemplateFormatVersion: "2010-09-09"
Description: "YAM Funds Backend AWS-native infrastructure: DynamoDB, App Runner, IAM and useful outputs."

Parameters:
  ProjectName:
    Type: String
    Default: yam-funds
    Description: Prefix used to name AWS resources.
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    Description: Environment name used in resource names and tags.
  ContainerImage:
    Type: String
    Description: Full container image URI to deploy, for example account.dkr.ecr.region.amazonaws.com/yam-funds-backend:latest.
  CorsAllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated allowed CORS origins for the API.
  CreateEcrRepository:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Whether to create an ECR repository for the application image.
  EcrRepositoryName:
    Type: String
    Default: yam-funds-backend
    Description: ECR repository name created when CreateEcrRepository is true.
  AppRunnerCpu:
    Type: String
    Default: "0.5 vCPU"
    AllowedValues: ["0.25 vCPU", "0.5 vCPU", "1 vCPU", "2 vCPU", "4 vCPU"]
    Description: CPU reserved for the App Runner service.
  AppRunnerMemory:
    Type: String
    Default: "1 GB"
    AllowedValues: ["0.5 GB", "1 GB", "2 GB", "3 GB", "4 GB", "6 GB", "8 GB", "10 GB", "12 GB"]
    Description: Memory reserved for the App Runner service.
  DynamoDBBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: DynamoDB billing mode. PAY_PER_REQUEST satisfies the PT requirement; PROVISIONED can be used for stricter cost control.
  DynamoDBReadCapacityUnits:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Read capacity units used when DynamoDBBillingMode is PROVISIONED.
  DynamoDBWriteCapacityUnits:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Write capacity units used when DynamoDBBillingMode is PROVISIONED.
  DynamoDBSeedEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Seed demo data on application startup. Keep true for the technical test environment.

Conditions:
  ShouldCreateEcrRepository: !Equals [!Ref CreateEcrRepository, "true"]
  UseProvisionedDynamoDB: !Equals [!Ref DynamoDBBillingMode, PROVISIONED]

Resources:
  ClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-clients"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FundsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-funds"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-subscriptions"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: clientId
          AttributeType: S
        - AttributeName: fundId
          AttributeType: S
      KeySchema:
        - AttributeName: clientId
          KeyType: HASH
        - AttributeName: fundId
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-transactions"
      BillingMode: !Ref DynamoDBBillingMode
      ProvisionedThroughput: !If
        - UseProvisionedDynamoDB
        - ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
          WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: clientId
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: clientId
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  EcrRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateEcrRepository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-apprunner-ecr-access-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-apprunner-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBApplicationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ClientsTable.Arn
                  - !GetAtt FundsTable.Arn
                  - !GetAtt SubscriptionsTable.Arn
                  - !GetAtt TransactionsTable.Arn
        - PolicyName: NotificationsReservedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReservedForFutureSnsSmsAdapter
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
              - Sid: ReservedForFutureSesEmailAdapter
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-backend"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ContainerImage
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: SPRING_PROFILES_ACTIVE
                Value: prod
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: DYNAMODB_SEED_ENABLED
                Value: !Ref DynamoDBSeedEnabled
              - Name: DYNAMODB_CLIENTS_TABLE
                Value: !Ref ClientsTable
              - Name: DYNAMODB_FUNDS_TABLE
                Value: !Ref FundsTable
              - Name: DYNAMODB_SUBSCRIPTIONS_TABLE
                Value: !Ref SubscriptionsTable
              - Name: DYNAMODB_TRANSACTIONS_TABLE
                Value: !Ref TransactionsTable
              - Name: CORS_ALLOWED_ORIGINS
                Value: !Ref CorsAllowedOrigins
      InstanceConfiguration:
        Cpu: !Ref AppRunnerCpu
        Memory: !Ref AppRunnerMemory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 20
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ClientsTableName:
    Description: DynamoDB clients table name.
    Value: !Ref ClientsTable
  FundsTableName:
    Description: DynamoDB funds table name.
    Value: !Ref FundsTable
  SubscriptionsTableName:
    Description: DynamoDB subscriptions table name.
    Value: !Ref SubscriptionsTable
  TransactionsTableName:
    Description: DynamoDB transactions table name.
    Value: !Ref TransactionsTable
  DynamoDBBillingMode:
    Description: DynamoDB billing mode used by all application tables.
    Value: !Ref DynamoDBBillingMode
  AppRunnerServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt AppRunnerService.ServiceArn
  AppRunnerServiceUrl:
    Description: Stable App Runner service URL.
    Value: !GetAtt AppRunnerService.ServiceUrl
  ApplicationBaseUrl:
    Description: Stable public base URL for the API.
    Value: !Sub "https://${AppRunnerService.ServiceUrl}"
  AppRunnerInstanceRoleArn:
    Description: IAM role used by the application runtime.
    Value: !GetAtt AppRunnerInstanceRole.Arn
  EcrRepositoryUri:
    Condition: ShouldCreateEcrRepository
    Description: ECR repository URI for the application image.
    Value: !GetAtt EcrRepository.RepositoryUri
