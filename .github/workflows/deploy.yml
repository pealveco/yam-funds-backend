name: Deploy AWS

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'yam-funds-backend' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'yam-funds' }}
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME || 'prod' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'yam-funds-backend-prod' }}
  DYNAMODB_BILLING_MODE: ${{ vars.DYNAMODB_BILLING_MODE || 'PROVISIONED' }}
  DYNAMODB_READ_CAPACITY_UNITS: ${{ vars.DYNAMODB_READ_CAPACITY_UNITS || '1' }}
  DYNAMODB_WRITE_CAPACITY_UNITS: ${{ vars.DYNAMODB_WRITE_CAPACITY_UNITS || '1' }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew --no-daemon --no-watch-fs test

  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image URI
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 \
          || aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -f deployment/Dockerfile \
            -t "$ECR_REPOSITORY:$GITHUB_SHA" .

      - name: Push image
        run: |
          docker tag "$ECR_REPOSITORY:$GITHUB_SHA" "$IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file deployment/cloudformation/yam-funds-backend.yaml \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              ContainerImage="$IMAGE_URI" \
              VpcId="${{ vars.VPC_ID }}" \
              PublicSubnetIds="${{ vars.PUBLIC_SUBNET_IDS }}" \
              CorsAllowedOrigins="${{ vars.CORS_ALLOWED_ORIGINS }}" \
              CreateEcrRepository=false \
              EcrRepositoryName="$ECR_REPOSITORY" \
              DynamoDBBillingMode="$DYNAMODB_BILLING_MODE" \
              DynamoDBReadCapacityUnits="$DYNAMODB_READ_CAPACITY_UNITS" \
              DynamoDBWriteCapacityUnits="$DYNAMODB_WRITE_CAPACITY_UNITS"

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
