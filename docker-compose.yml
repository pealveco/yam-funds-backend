services:
  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    image: yam-funds-backend:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DYNAMODB_ENDPOINT: ${AWS_DYNAMODB_ENDPOINT:-http://dynamodb-local:8000}
      DYNAMODB_SEED_ENABLED: ${DYNAMODB_SEED_ENABLED:-true}
      DYNAMODB_CLIENTS_TABLE: ${DYNAMODB_CLIENTS_TABLE:-yam-funds-clients}
      DYNAMODB_FUNDS_TABLE: ${DYNAMODB_FUNDS_TABLE:-yam-funds-funds}
      DYNAMODB_SUBSCRIPTIONS_TABLE: ${DYNAMODB_SUBSCRIPTIONS_TABLE:-yam-funds-subscriptions}
      DYNAMODB_TRANSACTIONS_TABLE: ${DYNAMODB_TRANSACTIONS_TABLE:-yam-funds-transactions}
    depends_on:
      dynamodb-local:
        condition: service_healthy

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://localhost:8000 >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
